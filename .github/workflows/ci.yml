name: CI

on:
  push:
    branches: [ main, "feat/**" ]
  pull_request:
    branches: [ main ]

jobs:
  backend-lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: civicpilot_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio httpx
          pip install -r backend/requirements.txt

      - name: Run linter (ruff)
        run: |
          ruff check backend

      - name: Run pytest
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/civicpilot_test
          JWT_SECRET: ci-test-secret-key-32-characters-minimum
          OFFICER_PASSWORD: testpassword
          MOCK_LLM: "true"
          SIM_TIME_SCALE: "1"
          FRONTEND_ORIGIN: "http://localhost:3000"
          NOMINATIM_USER_AGENT: "CivicPilot-CI/1.0"
        run: |
          pytest -v backend/tests

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check frontend
        run: |
          if [ -f "frontend/package.json" ]; then
            cd frontend
            npm ci
            npm run build
          else
            echo "No frontend package.json found yet. Skipping frontend build."
          fi
